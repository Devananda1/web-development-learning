<!DOCTYPE html>
<html>

<head>
    <title>Flexbox Demo</title>
    <link rel="stylesheet" href="style.css">

    <style>

        .container {
            display: flex;
                justify-content: center;
                gap: 20px;
        }

        .box {
            border: 2px solid blue;
            padding: 20px;
            margin: 10px;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="box">Box 1</div>

        <div class="box">Box 2</div>

        <div class="box">Box 3</div>

    </div>

</body>

</html>
